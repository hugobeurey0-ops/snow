<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNOW · Sophie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SNOW">
<meta name="theme-color" content="#FBD7DC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBD7DC;--s1:#FFF7EE;--s2:#F8EADF;--s3:#F1DCCD;--line:#EFCFC8;
  --tx:#3E1B13;--tx2:#7C4B3F;--mut:#A27D72;
  --acc:#C3142D;--acc-ink:#FFF7EE;--acc-dim:rgba(195,20,45,.09);
  --red:#C3142D;--red-d:#A10F24;--pink:#F6B3BE;--pink-d:#EF9AAA;--brown:#4A2117;--brown-m:#6B3426;--cream:#FFF7EE;
  --warn:#6B3426;--bad:#C3142D;--good:#2F7D4F;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em;margin:0;font-weight:700}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px}
#app{max-width:720px;margin:0 auto;padding:18px 16px calc(290px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.sub{color:var(--tx2);font-size:13px}
.mut{color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--s3)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#200;border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:12px;color:var(--tx2)}
.chip.acc{background:var(--acc-dim);border-color:transparent;color:var(--acc)}
.chip.warn{background:rgba(255,181,71,.13);border-color:transparent;color:var(--warn)}
input.f,select.f,textarea.f{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc)}
textarea.f{min-height:80px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px;font-weight:500}
.notice{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.3);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
.empty{text-align:center;padding:36px 18px;color:var(--tx2)}
.empty h3{color:var(--tx);margin-bottom:6px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,19,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);text-decoration:none;font-size:11px;font-weight:600;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--acc)}

/* day cards */
.day{display:flex;align-items:center;gap:12px}
.day .dn{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-size:22px;font-weight:700;line-height:1.1}
.day.next{border-color:var(--acc)}
.exlist{color:var(--tx2);font-size:13px;margin-top:2px}

/* workout */
.wk-head{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0 12px;margin:-6px 0 8px;border-bottom:1px solid var(--line)}
.clock{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.ex-name{font-weight:700;font-size:16px}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font-size:11px;color:var(--mut);font-weight:600;text-align:left;padding:0 4px;text-transform:uppercase;letter-spacing:.04em}
.sets td{padding:0 4px}
.sets td.n{width:30px;color:var(--tx2);font-weight:700;text-align:center}
.sets td.prev{font-size:12px;color:var(--mut);white-space:nowrap;width:70px}
.sets input{background:var(--bg);border:1px solid var(--line);border-radius:10px;height:46px;width:100%;text-align:center;font-size:18px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.sets input:focus{border-color:var(--acc)}
.sets td.ok{width:52px}
.done-btn{width:48px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.done-btn svg{width:22px;height:22px;opacity:.35}
tr.done input{background:var(--acc-dim);border-color:transparent;color:var(--acc)}
tr.done .done-btn{background:var(--acc);border-color:var(--acc)}
tr.done .done-btn svg{opacity:1;stroke:var(--acc-ink)}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));width:min(688px,calc(100% - 16px));background:#12160b;border:2px solid var(--acc);border-radius:20px;padding:12px 16px 14px;z-index:25;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.7)}
.restbar.on{display:block}
.restbar .lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.restbar .t{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-size:84px;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);text-align:center;margin:2px 0 6px}
.restbar .next{font-size:14px;color:var(--tx);text-align:center;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .next span{color:var(--tx2)}
.restbar .prog{height:10px;background:rgba(255,255,255,.08);border-radius:10px;margin-bottom:12px;overflow:hidden}
.restbar .prog i{display:block;height:100%;background:var(--acc);border-radius:10px;transition:width .25s linear}
.restbar .btns{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.restbar .btns .btn{min-height:48px;font-size:15px}
.restbar.over{border-color:var(--warn);background:#1f1606;animation:pulse 1s ease-in-out infinite}
.restbar.over .t,.restbar.over .lab{color:var(--warn)}
.restbar.over .prog i{background:var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,181,71,.25),0 -10px 40px rgba(0,0,0,.7)}}
.clock.huge{font-size:96px;text-align:center;line-height:1;color:var(--acc);margin:18px 0 6px}
.pct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--acc-dim);font-size:13px}
.pct b{color:var(--acc);font-size:15px}
.pct input{width:76px;min-height:34px;padding:4px 8px;text-align:center}

/* editor */
.ed-ex{display:grid;grid-template-columns:1fr 58px 58px 58px 66px auto;gap:6px;align-items:center;margin-bottom:6px}
.ed-ex input{min-height:40px;padding:8px;text-align:center}
.ed-ex input.nm{text-align:left}
.ed-hd{display:grid;grid-template-columns:1fr 58px 58px 58px 66px auto;gap:6px;font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:.03em;margin:8px 0 4px}
.ed-hd span{text-align:center}.ed-hd span:first-child{text-align:left}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--s2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);padding:0}
.icon-btn:hover{color:var(--tx)}
.icon-btn svg{width:16px;height:16px}
@media (max-width:560px){
  .ed-ex,.ed-hd{grid-template-columns:repeat(4,1fr) 112px}
  .ed-ex{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .ed-ex input.nm{grid-column:1/-1}
  .ed-hd span:first-child{display:none}
  .ed-ex .acts{justify-content:flex-end}
}

/* history */
.month{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;text-transform:uppercase;color:var(--tx2);font-size:16px;margin:22px 0 8px;letter-spacing:.04em}
.hs{cursor:pointer}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--tx2)}
.stats b{color:var(--tx);font-weight:600}
.hs-detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.hs-detail .e{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.hs-detail .e span:last-child{color:var(--tx2);text-align:right}

/* progression */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .v{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.tile .v small{font-size:16px;color:var(--tx2);margin-left:2px}
.tile .k{font-size:12px;color:var(--tx2)}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;z-index:50;display:none;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl td,table.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.modal-bg{align-items:center}}
.pr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:10px 14px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;color:var(--tx2);font-weight:600;font-size:13px}
.seg button.on{background:var(--s3);color:var(--tx)}
.fig{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.fig svg{display:block;width:100%;height:auto;max-width:480px;margin:0 auto}
.fig ul{margin:8px 0 6px;padding-left:18px;color:var(--tx2);font-size:13px}
.fig li{margin:2px 0}
.fig a{color:var(--acc);font-size:13px;font-weight:600;text-decoration:none}
.ss{border:2px solid var(--acc);border-radius:18px;padding:10px 8px 2px;margin-bottom:12px;background:linear-gradient(180deg,rgba(198,242,78,.07),transparent 120px)}
.ss>.card{margin-bottom:8px}
.ss-lab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);padding:0 6px 10px}
.ss-badge{background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.ss-tag{display:inline-block;background:var(--acc-dim);color:var(--acc);font-weight:800;font-size:12px;padding:1px 7px;border-radius:6px;margin-right:7px;vertical-align:2px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:8px}
.rpe button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:16px;cursor:pointer;padding:0}
.rpe button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.rpe-leg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:6px}
.rpe-txt{text-align:center;font-weight:600;margin-top:8px;min-height:20px;color:var(--acc)}
.hello{margin:6px 0 16px}
.hello .sub{text-transform:capitalize}
h1.hi{font-size:40px;text-transform:none;letter-spacing:0;margin-top:2px}
.home-card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.home-card.todo{border-color:var(--acc);background:linear-gradient(180deg,rgba(198,242,78,.08),var(--s1) 140px)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 12px}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 4px 6px;text-align:center}
.mini svg{display:block;width:100%;height:auto}
.mini span{display:block;font-size:10.5px;line-height:1.2;color:var(--tx2);margin-top:2px;min-height:25px}
.quote{position:relative;margin:4px 0 16px;padding:12px 14px 12px 40px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:15px;font-style:italic;color:var(--tx);line-height:1.4}
.quote:before{content:"“";position:absolute;left:12px;top:2px;font-family:Georgia,serif;font-size:40px;color:var(--acc);font-style:normal}
.restbar .rq{font-size:13px;font-style:italic;color:var(--tx2);text-align:center;margin:-4px 0 10px}
.hab{display:grid;gap:4px;margin-top:12px;align-items:center}
.hn{font-size:10px;color:var(--mut);text-align:center}
.hn.on{color:var(--acc);font-weight:700}
.hl{font-size:12px;font-weight:600;color:var(--tx2)}
.hc{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;min-width:0}
.hc.done,.lg.done{background:var(--acc);color:var(--acc-ink)}
.hc.cur,.lg.cur{border:2px solid var(--acc)}
.hc.miss,.lg.miss{background:rgba(255,107,107,.18);border:1px solid rgba(255,107,107,.35)}
.hc.fut,.lg.fut{border:1px dashed var(--line)}
.lg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;box-sizing:border-box}
.tile-v{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.tile-v small{font-size:15px;color:var(--tx2)}
.restbar.full{left:0;right:0;top:0;bottom:0;transform:none;width:auto;border:0;border-radius:0;background:#0b0d09;display:flex!important;flex-direction:column;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));z-index:45;box-shadow:none;animation:none}
.restbar.full.over{background:#1c1406}
.rb-top{display:flex;align-items:center;justify-content:space-between}
.restbar.full .rb-top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:22px;right:22px}
.restbar.full .lab{font-size:15px}
.ring{position:relative;width:min(78vw,340px);margin:10px auto 18px;display:none}
.restbar.full .ring{display:block}
.ring svg{display:block;width:100%;height:auto}
.rg-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
.rg-fg{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.restbar.over .rg-fg{stroke:var(--warn)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.restbar.full .t{font-size:min(26vw,120px);margin:0}
.rtot{font-size:14px;color:var(--tx2)}
.restbar.full .prog{display:none}
.restbar.full .rq{font-size:15px;margin:0 0 8px}
.restbar.full .next{font-size:16px;margin-bottom:22px;white-space:normal}
.restbar.full .btns .btn{min-height:60px;font-size:17px}
.restbar.mini .ring{display:block;width:auto;margin:0}
.restbar.mini .ring svg{display:none}
.restbar.mini .ring-in{position:static;flex-direction:row;align-items:baseline;justify-content:center;gap:10px}
.restbar.mini .t{font-size:76px;margin:0}
.restbar.mini .rq{display:none}
.restbar.mini .next{white-space:nowrap}
.restbar .next span{display:inline}
.restbar.full .t.long{font-size:min(18vw,86px)}
body.resting nav.tabs{display:none}
.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;color:var(--tx2)}

/* strava */
.btn.strava{background:#FC4C02;border-color:#FC4C02;color:#fff}
.sv-logo{width:42px;height:42px;border-radius:12px;background:#FC4C02;color:#fff;display:flex;align-items:center;justify-content:center}
.sv-logo svg{width:24px;height:24px}
.sv-box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px 12px;margin:14px 0}
.sv-f{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sv-f:last-child{border-bottom:none}
.sv-f .l{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.sv-v{font-weight:600;color:var(--brown)}
.sv-v:first-letter{text-transform:uppercase}
.sv-desc{white-space:pre-wrap;font:13px/1.45 "DM Sans",Inter,sans-serif;color:var(--brown);margin:4px 0 0}
.sv-steps{padding-left:20px;font-size:14px;color:var(--tx2);margin:0 0 14px}
.sv-steps li{margin:3px 0}
/* calendrier */
.pw-row{margin-top:14px}
.quote.day-q{margin:-2px 0 14px;font-size:15.5px}
.quote.day-q.done{background:var(--red);color:var(--cream);box-shadow:3px 3px 0 var(--brown)}
.quote.day-q.done:before{color:var(--cream)}
.quote.day-q.rest,.quote.day-q.free{background:var(--cream);box-shadow:3px 3px 0 var(--pink-d);transform:rotate(1deg)}
.quote.day-q.missed{background:var(--cream);color:var(--brown-m);box-shadow:3px 3px 0 var(--brown-m)}
.quote.day-q.missed:before{color:var(--brown-m)}
.pw-lab{font-weight:700;color:var(--brown);margin-bottom:6px;font-size:14px}
.pw-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pw-d{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--brown);cursor:pointer;font:inherit}
.pw-d span{font-size:10.5px;color:var(--mut);font-weight:600}
.pw-d b{font-family:"Fraunces",Georgia,serif;font-size:18px}
.pw-d.today{border-color:var(--red)}
.pw-d.on{background:var(--red);border-color:var(--red);color:var(--cream)}
.pw-d.on span{color:#FFD5DB}
.pw-d.done{background:var(--pink);border-color:var(--pink-d);color:var(--red)}
.pw-d:disabled{opacity:.35;cursor:default}
.pw-status{margin-top:14px;text-align:center;font-size:14px;color:var(--tx2);font-weight:600}
.pw-status.ok{color:var(--red);font-family:"Fraunces",Georgia,serif;font-size:17px}
.up{display:flex;align-items:center;gap:12px;padding:12px 14px}

.cal{margin-top:6px}
.cd{min-height:56px;border:none;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;cursor:pointer;color:var(--brown);font:inherit}

.mks{display:flex;flex-direction:column;gap:2px;margin-top:4px;width:100%;padding:0 2px;box-sizing:border-box}
.tg{display:block;width:100%;box-sizing:border-box;font-style:normal;font-size:10.5px;font-weight:800;line-height:1;padding:4px 0;border-radius:6px;text-align:center;white-space:nowrap;letter-spacing:-.01em}
.row .tg{display:inline-block;width:auto;padding:3px 6px;margin-right:3px}
.tg.snow.done{background:var(--red);color:var(--cream)}
.tg.caf.done{background:var(--brown);color:var(--cream)}
.tg.plan{background:#fff;border:1.5px dashed var(--red);color:var(--red);padding:2px 0}
.tg.caf.plan{border-color:var(--brown);color:var(--brown)}
.row .tg.plan{padding:2px 6px}
.tg.miss{background:var(--pink);color:var(--red);text-decoration:line-through;opacity:.8}
.cd.has-done.d-snow{background:var(--red);color:var(--cream)}
.cd.has-done.d-caf{background:var(--brown);color:var(--cream)}

.cd.has-plan.p-caf{border-color:var(--brown)}
.cd.has-plan .tg.plan{border:none;background:transparent;padding:3px 0}
.cd.has-miss{background:var(--pink)}
.cd.sel.has-done{outline-color:var(--brown);outline-offset:2px}
.cd.sel{outline:2.5px solid var(--red);outline-offset:-2px;background:var(--pink)}
.mk{display:inline-block;width:9px;height:9px;border-radius:99px;box-sizing:border-box;vertical-align:-1px}
.mk.snow.done{background:var(--red)}
.mk.caf.done{background:var(--brown)}
.mk.plan{border:2px solid var(--red)}
.mk.caf.plan{border-color:var(--brown)}
.mk.miss{background:var(--pink-d)}
.plan-l{font-size:13.5px;margin:2px 0 12px;color:var(--tx2)}
.plan-l a{color:inherit;font-weight:700}
.home-card.todo .plan-l{color:#FFE3E7}
/* ===== DA « Doceria » : rouge cerise, rose, chocolat, crème ===== */

/* accueil */

.rpe button.on{background:var(--red);color:var(--cream);border-color:var(--red)}
.rpe-txt{color:var(--red);font-family:"Fraunces",Georgia,serif;font-size:17px}

.restbar{background:var(--red);border:none;color:var(--cream);box-shadow:0 -8px 30px rgba(120,10,30,.35)}

.restbar .next{color:var(--cream)}

.restbar .btn{background:rgba(255,247,238,.16);border-color:rgba(255,247,238,.35);color:var(--cream)}

/* historique / progression */

</style>

<body>
<div id="app"><div class="loading">Chargement…</div></div>
<div class="restbar" id="restbar"></div>
<div id="tip"></div>
<nav class="tabs" id="tabs"></nav>
<datalist id="exlib"></datalist>

<script>
// ---------- illustrations des exercices (schémas originaux) ----------
const FIG = (()=>{
  const v=(a,L)=>[L*Math.sin(a*Math.PI/180), L*Math.cos(a*Math.PI/180)];
  const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];
  function joints(P){
    const fr=!!P.front, H=[0,0];
    const t=P.torso||0;
    const S=add(H,v(180-t,41));
    const head=add(S,v(180-(t*0.75+(P.head||0)),13));
    const hipN=fr?add(H,[-6,0]):H, hipF=fr?add(H,[6,0]):H;
    const shN=fr?add(S,[-9,2]):S, shF=fr?add(S,[9,2]):S;
    const leg=(h,[th,sh,ft=80])=>{const K=add(h,v(th,32)),A=add(K,v(sh,32)),T=add(A,v(ft,11));return {K,A,T};};
    const arm=(s,[u,f])=>{const E=add(s,v(u,23)),W=add(E,v(f,21));return {E,W};};
    const LN=leg(hipN,P.ln||[0,0]), LF=leg(hipF,P.lf||P.ln||[0,0]);
    const AN=arm(shN,P.an||[5,0]), AF=arm(shF,P.af||P.an||[5,0]);
    const J={H,S,head,hipN,hipF,shN,shF,kneeN:LN.K,ankleN:LN.A,toeN:LN.T,kneeF:LF.K,ankleF:LF.A,toeF:LF.T,elbowN:AN.E,handN:AN.W,elbowF:AF.E,handF:AF.W};
    const anc=J[P.anchor||'ankleN'], d=[P.at[0]-anc[0],P.at[1]-anc[1]];
    for(const k in J) J[k]=add(J[k],d);
    if(P.mirror) for(const k in J) J[k]=[170-J[k][0],J[k][1]];
    return J;
  }
  const L=(a,b,c,w=5)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const PL=(pts,c,w=5)=>`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const FAR='#DDB0A8', NEAR='#4A2117', ACC='#C3142D', PROP='#C9A79B', PROP2='#A0786C';
  function figure(J){
    return PL([J.hipF,J.kneeF,J.ankleF,J.toeF],FAR)+PL([J.shF,J.elbowF,J.handF],FAR)
      +L(J.H,J.S,NEAR,6)+(J.shN!==J.S?L(J.shN,J.shF,NEAR,5)+L(J.hipN,J.hipF,NEAR,5):'')
      +PL([J.hipN,J.kneeN,J.ankleN,J.toeN],NEAR)+PL([J.shN,J.elbowN,J.handN],NEAR)
      +`<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="8.5" fill="${NEAR}"/>`;
  }
  const ground=`<line x1="4" y1="172" x2="166" y2="172" stroke="${PROP}" stroke-width="2"/>`;
  const box=(x1,y1,x2)=>`<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${172-y1}" rx="3" fill="#F6B3BE" stroke="${PROP}" stroke-width="2"/>`;
  const plate=(p,r=12)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="#FFF7EE" stroke="${ACC}" stroke-width="3"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${ACC}"/>`;
  const db=p=>`<rect x="${(p[0]-7).toFixed(1)}" y="${(p[1]-3).toFixed(1)}" width="14" height="6" rx="2" fill="${ACC}"/>`;
  const arrow=(x1,y1,cx,cy,x2,y2)=>`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${ACC}" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="${x2}" cy="${y2}" r="3" fill="${ACC}"/>`;

  // Chaque exercice : deux phases {pose, props(J)} + consignes
  const D={
    squat:{phases:[
      {pose:{at:[88,166],torso:6,ln:[3,-3],an:[-35,170]},props:J=>plate(add(J.S,[-12,4]),12)},
      {pose:{at:[88,166],torso:44,ln:[80,-30],an:[-35,170]},props:J=>plate(add(J.S,[-12,4]),12)}],
      cues:["Pieds largeur d'épaules, genoux dans l'axe des pieds","Descends lentement jusqu'aux cuisses parallèles au sol","Dos neutre, pousse le sol pour remonter"]},
    rdl:{phases:[
      {pose:{at:[84,166],torso:4,ln:[2,-2],an:[6,6]},props:J=>plate(add(J.handN,[0,4]),13)},
      {pose:{at:[84,166],torso:76,ln:[34,-12],an:[-6,-6]},props:J=>plate(add(J.handN,[0,4]),13)}],
      cues:["Genoux légèrement fléchis, ils ne bougent plus","Pousse les hanches en arrière, la barre glisse le long des cuisses","Arrête avant que le dos s'arrondisse, remonte en serrant les fessiers"]},
    bulgares:{phases:[
      {pose:{at:[116,166],torso:3,ln:[22,-6],lf:[-28,-102,-120],an:[2,0]},props:J=>`<rect x="14" y="124" width="50" height="9" rx="3" fill="#F6B3BE" stroke="${PROP}" stroke-width="2"/>`+L([20,133],[20,172],PROP,3)+L([58,133],[58,172],PROP,3)+db(J.handN)},
      {pose:{at:[116,166],torso:8,ln:[78,-14],lf:[-22,-138,-120],an:[2,0]},props:J=>`<rect x="14" y="124" width="50" height="9" rx="3" fill="#F6B3BE" stroke="${PROP}" stroke-width="2"/>`+L([20,133],[20,172],PROP,3)+L([58,133],[58,172],PROP,3)+db(J.handN)}],
      cues:["Pied arrière posé sur le banc (lacets)","Descends à la verticale, le genou arrière vers le sol","Pousse dans le talon avant pour remonter"]},
    tractions:{phases:[
      {pose:{anchor:'handN',at:[88,22],torso:0,an:[162,172],ln:[25,-60],lf:[18,-70]},props:()=>L([30,20],[150,20],PROP2,4)},
      {pose:{anchor:'handN',at:[88,22],torso:-8,an:[25,176],ln:[25,-60],lf:[18,-70]},props:()=>L([30,20],[150,20],PROP2,4)}],
      cues:["Pars bras tendus, épaules basses","Tire les coudes vers les hanches","Menton au-dessus de la barre, redescends sous contrôle"]},
    mollets:{phases:[
      {pose:{anchor:'toeN',at:[104,140],torso:0,ln:[-4,-4,118],lf:[6,-75],an:[40,70]},props:()=>box(90,140,160)},
      {pose:{anchor:'toeN',at:[104,140],torso:0,ln:[0,0,50],lf:[6,-75],an:[40,70]},props:()=>box(90,140,160)}],
      cues:["Avant-pied sur le bord d'une marche","Talon le plus bas possible, puis monte sur la pointe","Tiens 2 s en haut, redescends lentement"]},
    boxjump:{phases:[
      {pose:{at:[44,166],torso:48,ln:[62,-26],an:[-70,-60]},props:()=>box(108,132,162)},
      {pose:{at:[128,130],torso:30,ln:[62,-24],an:[75,85]},props:()=>box(108,132,162)+arrow(30,92,70,10,112,60)}],
      cues:["Élan des bras, saute en poussant fort dans le sol","Réception douce sur la box, genoux dans l'axe","Redescends en marchant, pas en sautant"]},
    drop:{phases:[
      {pose:{at:[36,134],torso:0,an:[5,0]},props:()=>box(8,136,62)},
      {pose:{at:[112,166],torso:32,ln:[58,-22],an:[75,85]},props:()=>box(8,136,62)+arrow(50,70,90,40,112,92)}],
      cues:["Fais un pas dans le vide depuis la box (sans sauter vers le haut)","Réception sur l'avant des pieds, genoux fléchis et dans l'axe","Tiens 2 s, sans bruit à l'atterrissage"]},
    nordic:{phases:[
      {pose:{anchor:'kneeN',at:[56,160],torso:0,ln:[0,-90,0],an:[35,160]},props:J=>`<rect x="38" y="162" width="56" height="10" rx="3" fill="#F6B3BE" stroke="${PROP}" stroke-width="2"/>`+`<rect x="${(J.ankleN[0]-7).toFixed(1)}" y="${(J.ankleN[1]-11).toFixed(1)}" width="14" height="7" rx="2" fill="${ACC}"/>`},
      {pose:{anchor:'kneeN',at:[56,160],torso:52,ln:[-52,-90,0],an:[40,30]},props:J=>`<rect x="38" y="162" width="56" height="10" rx="3" fill="#F6B3BE" stroke="${PROP}" stroke-width="2"/>`+`<rect x="${(J.ankleN[0]-7).toFixed(1)}" y="${(J.ankleN[1]-11).toFixed(1)}" width="14" height="7" rx="2" fill="${ACC}"/>`}],
      cues:["À genoux, chevilles bloquées (partenaire, barre ou espalier)","Bascule vers l'avant le plus lentement possible, corps gainé des genoux à la tête","Rattrape-toi avec les mains, repousse pour remonter"]},
    stepdown:{phases:[
      {pose:{at:[86,140],torso:2,ln:[0,0],lf:[10,6],an:[60,80]},props:()=>box(20,142,98)},
      {pose:{at:[86,140],torso:36,ln:[90,-35],lf:[28,28],an:[62,82]},props:()=>box(20,142,98)}],
      cues:["Debout sur la box, une jambe dans le vide","Descends en 4 s jusqu'à effleurer le sol du talon","Genou d'appui au-dessus du pied, il ne rentre pas vers l'intérieur"]},
    skater:{front:true,phases:[
      {pose:{front:true,at:[58,166],torso:-14,ln:[-6,8],lf:[-40,-18],an:[-50,-30],af:[50,60]},props:()=>arrow(70,60,100,30,130,60)},
      {pose:{front:true,mirror:true,at:[58,166],torso:-14,ln:[-6,8],lf:[-40,-18],an:[-50,-30],af:[50,60]},props:()=>''}],
      cues:["Vu de face : saut latéral d'une jambe sur l'autre","Réception sur une jambe, genou dans l'axe du pied","Tiens 2 s avant de repartir de l'autre côté"]},
    landmine:{front:true,phases:[
      {pose:{front:true,at:[62,166],torso:-6,ln:[-10,-6],lf:[10,6],an:[-28,-12],af:[-58,-24]},props:J=>{const h=J.handN,a=[86,176],e=[h[0]+(h[0]-a[0])*0.25,h[1]+(h[1]-a[1])*0.25];return L(a,e,PROP2,5)+plate(e,9);}},
      {pose:{front:true,mirror:true,at:[62,166],torso:-6,ln:[-10,-6],lf:[10,6],an:[-28,-12],af:[-58,-24]},props:J=>{const h=J.handN,a=[84,176],e=[h[0]+(h[0]-a[0])*0.25,h[1]+(h[1]-a[1])*0.25];return L(a,e,PROP2,5)+plate(e,9);}}],

async function flushDraft(){
  if(state.mode!=='db'){ localSave(); return; }

  try{
    if(state.draft){ const {_synced,...d}=state.draft; await db.doc('meta/draft').set({draft:d}); if(state.draft) state.draft._synced=true; }

  }catch(e){ console.error(e); }
  draftWriting=false;

}

function subscribe(){

  const timer=setTimeout(()=>{ state.offline=true; state.ready=true; render(); },10000);
  const onErr=e=>{ console.error(e); state.offline=true; state.ready=true; render(); };
  const first={};
  const col=(name,q,key)=>q.onSnapshot(snap=>{
    state[key]=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...clone(d.data())}));
    if(!first[key] && !snap.metadata.fromCache){ first[key]=true; loaded(); }
    else if(!first[key]){ /* cache provisoire */ softRender(); }
    else softRender();
  },onErr);
  col('programs',db.collection('programs'),'programs');
  col('sessions',db.collection('sessions').orderBy('date','desc').limit(1000),'sessions');

  db.doc('meta/maxes').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    state.maxes = snap.exists ? clone(snap.data().m||{}) : {};
    if(!maxFirst && !snap.metadata.fromCache){ maxFirst=true; loaded(); } else softRender();
  },onErr);
  let draftFirst=false;
  db.doc('meta/draft').onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    const remote = snap.exists ? (snap.data().draft||null) : null;
    if(!remote){ if(state.draft && state.draft._synced){ state.draft=null; state.rest=null; softRender(); } }
    else if(!state.draft || (remote.updatedAt||0) > (state.draft.updatedAt||0)){ state.draft={...clone(remote),_synced:true}; softRender(); }

}

function lastFor(name, excludeId){
  const n=norm(name);
  for(const s of sortedSessions()){ if(s.id===excludeId) continue; const e=(s.exercises||[]).find(x=>norm(x.name)===n); if(e && e.sets && e.sets.length) return {date:s.date, sets:e.sets}; }
  return null;
}
function suggestion(ex){
  const last=lastFor(ex.name); if(!last) return null;
  const top=Math.max(...last.sets.map(s=>s.kg||0));
  const work=last.sets.filter(s=>(s.kg||0)===top);
  if(!top) return {kg:null, last, up:false};
  const hitTop = !!ex.repMax && work.length>=(ex.targetSets||1) && work.every(s=>(s.reps||0)>=ex.repMax);
  if(hitTop) return {kg: top + (top<20?1:2.5), last, up:true};

}
function progWeek(p){ if(!p.startDate) return null; return Math.floor((weekStart(new Date())-weekStart(p.startDate))/(7*864e5))+1; }

function visibleDays(p){

  const tot=progTotal(p); const ww=Math.min(Math.max(1,w),tot||w);
  return p.days.filter(d=>!d.weeks||(ww>=d.weeks[0]&&ww<=d.weeks[1]));
}
function nextDayId(p){
  const days=visibleDays(p);
  const s=sortedSessions().find(x=>x.programId===p.id && days.some(d=>d.id===x.dayId));
  if(!s) return days[0]?.id;
  const i=days.findIndex(d=>d.id===s.dayId);
  return days[(i+1)%days.length]?.id;
}

function summarize(){

  const s={id:d.id,date:d.startedAt,finishedAt:new Date().toISOString(),durationMin:Math.round((Date.now()-new Date(d.startedAt))/60000),programId:d.programId,programName:d.programName,dayId:d.dayId,dayName:d.dayName,exercises,notes:d.notes||''};

  return {s,prs};
}

const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const fromYmd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12);};
const typeOf=s=>s.kind==='class'?'caf':'snow';
const TYPE_LAB={snow:'Séance SNOW',caf:'CAF'};
function planFor(type,wsTime){ return state.plans.find(pl=>pl.type===type && weekStart(fromYmd(pl.date)).getTime()===wsTime); }
function sessionsOn(k){ return sortedSessions().filter(s=>ymd(s.date)===k); }
async function setPlan(type,date){
  const wsT=weekStart(fromYmd(date)).getTime(); const id=type+'-'+ymd(new Date(wsT));
  const cur=state.plans.find(pl=>pl.id===id);
  if(cur && cur.date===date){ state.plans=state.plans.filter(pl=>pl.id!==id); render(); await safe(store.del('plans',id)); return; }
  const pl={id,type,date}; upsert(state.plans,pl); render(); const {id:_,...d}=pl; await safe(store.put('plans',id,d));
}

function stravaData(s){
  const isC=s.kind==='class';
  const p=state.programs.find(x=>x.id===s.programId);
  const wk=p?Math.floor((weekStart(s.date)-weekStart(p.startDate))/(7*864e5))+1:null;
  const title=isC?'CAF 💪':(s.dayName||'Séance SNOW')+' 🏂';
  const lines=[];
  lines.push(isC?'Cours collectif cuisses · abdos · fessiers':'Prépa snowboard'+(wk&&p?` · semaine ${wk}/${progTotal(p)}`:''));
  if(s.rpe) lines.push(`Ressenti : ${s.rpe}/10`);
  if(!isC && (s.exercises||[]).length){ lines.push(''); s.exercises.forEach(e=>lines.push(`• ${e.name} : ${e.sets.map(x=>(x.kg?fmt(x.kg)+' kg × ':'')+x.reps).join(' · ')}`)); }
  const d=new Date(s.date);
  return {title,type:isC?'Entraînement':'Musculation',date:d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),time:d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),dur:s.durationMin||0,rpe:s.rpe,desc:lines.join('\n')};
}

function exerciseIndex(){
  const map={};
  sortedSessions().slice().reverse().forEach(s=>(s.exercises||[]).forEach(e=>{
    const k=norm(e.name); if(!map[k]) map[k]={name:e.name,points:[]};
    const best=e.sets.reduce((a,x)=>e1rm(x.kg,x.reps)>e1rm(a.kg,a.reps)?x:a,e.sets[0]);
    const top=Math.max(...e.sets.map(x=>x.kg||0));
    const bw=top===0; const bestR=e.sets.reduce((a,x)=>x.reps>a.reps?x:a,e.sets[0]);
    map[k].points.push({date:s.date,e1:bw?bestR.reps:e1rm(best.kg,best.reps),bw,best:bw?bestR:best,top,vol:e.sets.reduce((a,x)=>a+x.kg*x.reps,0),sets:e.sets});
  }));
  return map;
}

// ---------- graphiques (SVG) ----------
function niceRange(min,max){ if(min===max){min-=1;max+=1;} const pad=(max-min)*0.12; min-=pad; max+=pad; const span=max-min; const step=Math.pow(10,Math.floor(Math.log10(span/4))); const s=[1,2,2.5,5,10].map(m=>m*step).find(m=>span/m<=5)||step*10; return {min:Math.floor(min/s)*s,max:Math.ceil(max/s)*s,step:s}; }
function lineChart(pts,unit){
  const W=640,H=210,L=44,R=14,T=12,B=26; if(!pts.length) return '';
  const xs=pts.map(p=>new Date(p.x).getTime()); const x0=Math.min(...xs), x1=Math.max(...xs);
  const {min,max,step}=niceRange(Math.min(...pts.map(p=>p.y)),Math.max(...pts.map(p=>p.y)));
  const X=t=>x1===x0?(L+(W-L-R)/2):L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  let g=''; for(let v=min;v<=max+1e-9;v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EBCFC9" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" fill="#9B6F64" font-size="11">${fmt(v)}</text>`; }
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const xl=lab.map(i=>`<text x="${X(xs[i])}" y="${H-6}" text-anchor="${i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle'}" fill="#9B6F64" font-size="11">${dShort(pts[i].x)}</text>`).join('');
  const d=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+','+Y(p.y).toFixed(1)).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${pts.length>40?2.5:4}" fill="#C3142D" stroke="#FFF7EE" stroke-width="2"/>`).join('');
  const hits=pts.map((p,i)=>`<circle class="hit" cx="${X(xs[i])}" cy="${Y(p.y)}" r="14" fill="transparent" data-tip="${esc(p.tip)}"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution en ${unit}">${g}${xl}<path d="${d}" fill="none" stroke="#C3142D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${hits}</svg></div>`;
}
function barChart(bars){
  const W=640,H=170,L=28,R=6,T=10,B=24; const maxV=Math.max(1,...bars.map(b=>b.value)); const top=Math.max(maxV,3);
  const n=bars.length, slot=(W-L-R)/n, bw=Math.min(28,slot-6);
  const Y=v=>T+(1-v/top)*(H-T-B);
  let g=''; for(let v=0;v<=top;v+=Math.max(1,Math.ceil(top/3))) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EBCFC9"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" fill="#9B6F64" font-size="11">${v}</text>`;
  const rects=bars.map((b,i)=>{const cx=L+slot*i+slot/2, x=cx-bw/2, y=Y(b.value), h=Y(0)-y, r=Math.min(4,h);
    const bar=b.value?`<path d="M${x},${Y(0)}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${Y(0)}Z" fill="#C3142D"/>`:'';
    const lbl=(i%2===(n-1)%2)?`<text x="${cx}" y="${H-6}" text-anchor="middle" fill="#9B6F64" font-size="10.5">${b.label}</text>`:'';
    return bar+lbl+`<rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent" data-tip="${esc(b.tip)}"/>`;}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances par semaine">${g}${rects}</svg></div>`;
}

function groups(exs){ const g=[]; exs.forEach((e,ei)=>{ const last=g[g.length-1]; if(e.ss && last && last.ss===e.ss) last.items.push(ei); else g.push({ss:e.ss||null,items:[ei]}); }); return g; }

  else { const mx=Math.max(...g.items.map(ei=>d.exercises[ei].sets.length)); for(let si=0;si<mx;si++) g.items.forEach(ei=>{ if(si<d.exercises[ei].sets.length) seq.push([ei,si]); }); } }); return seq; }
function nextItem(){ const d=state.draft; if(!d||!d.exercises) return null; const seq=sequence(d); const f=state.lastDone;

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='closemodal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="closemodal"]')) return;
  if(el.dataset.act==='opensess' && e.target.closest('[data-stop]')) return;
  const a=el.dataset.act, D=el.dataset, dr=state.draft;
  const keepArm=['abandon','delprog','delsess'].includes(a); if(!keepArm) state.armed=null;
  switch(a){
    case 'tpl': { const p=fromTemplate(D.t); LS('muscu-prog',p.id); state.editing=null; saveProgram(p); break; }
    case 'newprog': state.editing={id:uid(),_new:true,name:'',createdAt:new Date().toISOString(),days:[{id:uid(),name:'Jour 1',exercises:[{name:'',sets:3,repMin:8,repMax:12,rest:90}]}]}; if(location.hash!=='#programmes') location.hash='#programmes'; else render(); break;
    case 'editprog': state.editing=clone(state.programs.find(p=>p.id===D.p)); render(); window.scrollTo(0,0); break;
    case 'dupprog': { const p=clone(state.programs.find(x=>x.id===D.p)); p.id=uid(); p.name+=' (copie)'; p.days.forEach(d=>d.id=uid()); saveProgram(p); break; }
    case 'delprog': if(state.armed==='dp'+D.p){ state.armed=null; deleteProgram(D.p); } else { state.armed='dp'+D.p; render(); } break;
    case 'canceledit': state.editing=null; render(); break;
    case 'saveprog': { const p=clone(state.editing); delete p._new;
      p.name=(p.name||'').trim()||'Mon programme';
      p.days=p.days.map((d,i)=>({...d,name:(d.name||'').trim()||'Jour '+(i+1),exercises:d.exercises.filter(x=>(x.name||'').trim()).map(x=>({...x,name:x.name.trim(),sets:+x.sets||3,repMin:+x.repMin||null,repMax:+x.repMax||+x.repMin||null,rest:+x.rest||90}))}));
      if(!p.days.length){ toast('Ajoute au moins un jour.'); break; }
      state.editing=null; saveProgram(p); window.scrollTo(0,0); break; }
    case 'addday': state.editing.days.push({id:uid(),name:'Jour '+(state.editing.days.length+1),exercises:[{name:'',sets:3,repMin:8,repMax:12,rest:90}]}); render(); break;
    case 'rmday': state.editing.days.splice(+D.di,1); render(); break;
    case 'dayup': { const i=+D.di; if(i>0){ const d=state.editing.days; [d[i-1],d[i]]=[d[i],d[i-1]]; render(); } break; }
    case 'addexp': { const ex=state.editing.days[+D.di].exercises; const prev=ex[ex.length-1]; ex.push({name:'',sets:prev?.sets||3,repMin:prev?.repMin||8,repMax:prev?.repMax||12,rest:prev?.rest||90}); render(); const ins=document.querySelectorAll(`input[data-e="ex"][data-k="name"][data-di="${D.di}"]`); ins[ins.length-1]?.focus(); break; }
    case 'rmexp': state.editing.days[+D.di].exercises.splice(+D.xi,1); render(); break;
    case 'exup': case 'exdown': { const ex=state.editing.days[+D.di].exercises, i=+D.xi, j=a==='exup'?i-1:i+1; if(j>=0&&j<ex.length){ [ex[i],ex[j]]=[ex[j],ex[i]]; render(); } break; }
    case 'start': newQuote(); state.figOpen={}; state.lastDone=null; startWorkout(D.p,D.d); break;
    case 'fig': state.figOpen[D.ei]=state.figOpen[D.ei]===false; render(); break;
    case 'editmax': e.preventDefault(); state.editMax=+D.ei; render(); break;
    case 'savemax': { const ex=dr.exercises[+D.ei]; const kg=num($('#max-'+D.ei).value); if(!kg||kg<=0){ toast('Indique un poids en kg.'); break; }
      state.editMax=null; saveMax(ex.name,kg).then(()=>{}); const pk=pctKg(ex); if(pk){ ex.sets.forEach(s=>{ if(!s.done) s.kg=String(pk.mid); }); ex.sugKg=pk.mid; } touchDraft(); render(); break; }
    case 'pmax': { const kg=num($('#pmax-'+D.i).value); saveMax(D.n,kg||0).then(()=>render()); break; }
    case 'startclass': { newQuote(); const p=state.programs.find(x=>x.id===D.p), d=p.days.find(x=>x.id===D.d);
      state.draft={id:uid(),kind:'class',startedAt:new Date().toISOString(),programId:p.id,programName:p.name,dayId:d.id,dayName:d.name,exercises:[],notes:'',updatedAt:Date.now()};
      touchDraft(); flushDraft(); render(); window.scrollTo(0,0); break; }
    case 'logclass': { e.preventDefault(); const p=state.programs.find(x=>x.id===D.p), d=p.days.find(x=>x.id===D.d); state.rpe=null; state.cnotes=state.cdate=state.cdur=null; state.modal={type:'class',programId:p.id,programName:p.name,dayId:d.id,dayName:d.name,duration:d.duration||45}; render(); break; }
    case 'saveclass': { const m=state.modal; if(!state.rpe){ toast('Choisis ton ressenti de 1 à 10.'); break; } const dt=$('#cdate').value||new Date().toISOString().slice(0,10); const now=new Date();
      const date=new Date(dt+'T'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':00').toISOString();
      const s={id:uid(),date,finishedAt:date,durationMin:Math.round(num($('#cdur').value)||m.duration),programId:m.programId,programName:m.programName,dayId:m.dayId,dayName:m.dayName,kind:'class',exercises:[],notes:'',volume:0,setsCount:0,rpe:state.rpe};
      state.rpe=null; state.cnotes=state.cdate=state.cdur=null;
      state.modal=null; saveSession(s).then(()=>toast('Séance CAF notée ✔')); state.calSel=ymd(new Date(s.date)); render(); break; }
    case 'free': location.hash='#seance'; startWorkout(null,null); break;
    case 'done': { const ex=dr.exercises[+D.ei], s=ex.sets[+D.si];
      if(!s.done){ const row=el.closest('tr'); const ri=row.querySelector('[data-f="reps"]'), ki=row.querySelector('[data-f="kg"]');
        if(s.reps==='' && ri.placeholder && num(ri.placeholder)!=null) s.reps=String(num(ri.placeholder));
        if(s.kg==='' && ki.placeholder && num(ki.placeholder)!=null) s.kg=String(num(ki.placeholder));
        if(!num(s.reps)){ toast('Indique le nombre de reps.'); ri.focus(); break; }
        s.done=true;
        // reporter la charge sur les séries suivantes vides
        ex.sets.slice(+D.si+1).forEach(n=>{ if(!n.done && (n.kg===''||n.kg===String(ex.sugKg??''))) n.kg=s.kg; });
        state.lastDone=[+D.ei,+D.si];
        const nx=nextItem();
        const gRest=()=>{ if(ex.rest) return ex.rest; const g=groups(dr.exercises).find(g=>g.items.includes(+D.ei)); return (g&&dr.exercises[g.items[g.items.length-1]].rest)||90; };
        if(!nx) state.rest=null;
        else if(ex.ss && dr.exercises[nx[0]].ss===ex.ss && nx[0]!==+D.ei && nx[1]===+D.si){ state.rest=null; renderRest(); toast('Enchaîne : '+dr.exercises[nx[0]].name); focusSet(nx[0],nx[1]); }
        else { startRest(gRest()); }
      } else s.done=false;
      touchDraft(); render(); break; }
    case 'addset': { const ex=dr.exercises[+D.ei]; const l=ex.sets[ex.sets.length-1]; ex.sets.push({kg:l?l.kg:'',reps:'',done:false}); touchDraft(); render(); break; }
    case 'rmset': { const ex=dr.exercises[+D.ei]; if(ex.sets.length>1){ ex.sets.pop(); touchDraft(); render(); } break; }
    case 'rmex': dr.exercises.splice(+D.ei,1); touchDraft(); render(); break;
    case 'addex': { const v=$('#newex').value.trim(); if(!v) break; const ex=makeEx({name:v,sets:3,repMin:8,repMax:12,rest:90}); dr.exercises.push(ex); touchDraft(); render(); break; }
    case 'abandon': if(state.armed==='abandon'){ state.armed=null; state.rest=null; clearDraft(); render(); toast('Séance abandonnée'); } else { state.armed='abandon'; render(); } break;
    case 'finish': state.modal='finish'; state.rpe=null; render(); break;
    case 'rpe': state.rpe=+D.v; { const notes=$('#cnotes'); if(notes) state.cnotes=notes.value; const cd=$('#cdate'), cu=$('#cdur'); if(cd) state.cdate=cd.value; if(cu) state.cdur=cu.value; } render(); break;
    case 'closemodal': state.modal=null; render(); break;
    case 'savesession': { const {s}=summarize(); if(!s.setsCount&&s.kind!=='class') break; if(!state.rpe){ toast('Choisis ton ressenti de 1 à 10.'); break; } s.rpe=state.rpe; state.rpe=null; state.modal=null; state.rest=null; const sp=saveSession(s); clearDraft(); sp.then(()=>toast('Séance enregistrée 💪')); state.calSel=ymd(new Date(s.date)); state.calMonth=null; location.hash='#calendrier'; render(); break; }
    case 'rest-15': state.rest.end-=15000; renderRest(); break;
    case 'rest+15': state.rest.end+=15000; beeped=false; renderRest(); break;
    case 'plan': setPlan(D.type,D.date); break;
    case 'pw': state.planWeek+=+D.d; render(); break;
    case 'calm': { const b=state.calMonth?new Date(state.calMonth):new Date(); b.setDate(1); b.setMonth(b.getMonth()+(+D.d)); state.calMonth=b.toISOString(); render(); break; }
    case 'calday': state.calSel=D.k; render(); break;
    case 'gocal': e.preventDefault(); state.planWeek=0; location.hash='#calendrier'; break;
    case 'strava': state.modal={type:'strava',id:D.s}; render(); break;
    case 'svcopy': { const s=state.sessions.find(x=>x.id===state.modal.id); const d=stravaData(s); copyTxt(D.k==='title'?d.title:D.k==='desc'?d.desc:d.title+'\n\n'+d.desc, D.k==='all'?'Titre et description copiés ✔':'Copié ✔'); break; }
    case 'svtcx': { const s=state.sessions.find(x=>x.id===state.modal.id); const name=(s.kind==='class'?'CAF':'SNOW')+'_'+ymd(s.date)+'.tcx';
      if(!dlNs){ const u=URL.createObjectURL(new Blob([tcxFor(s)],{type:'application/vnd.garmin.tcx+xml'})); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); break; }
      dlNs.save({filename:name,data:new Blob([tcxFor(s)],{type:'application/vnd.garmin.tcx+xml'})}).then(()=>toast('Fichier prêt ✔')).catch(()=>toast('Téléchargement annulé.')); break; }
    case 'warmup': startRest(600,'Échauffement · vélo'); break;
    case 'restmin': state.restMini=!state.restMini; renderRest(); break;
    case 'restskip': state.rest=null; renderRest(); break;
    case 'opensess': state.openSession=state.openSession===D.s?null:D.s; render(); break;
    case 'delsess': if(state.armed==='ds'+D.s){ state.armed=null; deleteSession(D.s); } else { state.armed='ds'+D.s; render(); } break;
    case 'addbw': { const kg=num($('#bwkg').value); const dt=$('#bwdate').value; if(!kg||kg<20||kg>300){ toast('Poids invalide.'); break; } saveBW({id:uid(),date:new Date(dt+'T12:00:00').toISOString(),kg}); break; }
    case 'delbw': deleteBW(D.b); break;
    case 'export': { const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),programs:state.programs,sessions:state.sessions,bodyweight:state.bodyweight,plans:state.plans});
      navigator.clipboard.writeText(data).then(()=>toast('Données copiées dans le presse-papiers')).catch(()=>toast("Copie refusée par le navigateur.")); break; }
    case 'import': state.modal='import'; render(); break;
    case 'doimport': { let d; try{ d=JSON.parse($('#importtxt').value); }catch(err){ toast('Texte illisible.'); break; }
      const tasks=[]; (d.programs||[]).forEach(p=>{ if(p&&p.id&&Array.isArray(p.days)){ upsert(state.programs,p); const {id,...x}=p; tasks.push(['programs',id,x]); }});
      (d.sessions||[]).forEach(s=>{ if(s&&s.id&&s.date){ upsert(state.sessions,s); const {id,...x}=s; tasks.push(['sessions',id,x]); }});
      (d.plans||[]).forEach(b=>{ if(b&&b.id&&b.date&&b.type){ upsert(state.plans,b); const {id,...x}=b; tasks.push(['plans',id,x]); }});
      (d.bodyweight||[]).forEach(b=>{ if(b&&b.id&&b.date){ upsert(state.bodyweight,b); const {id,...x}=b; tasks.push(['bodyweight',id,x]); }});
      state.modal=null; render();
      (async()=>{ for(const [c,id,x] of tasks){ try{ await store.put(c,id,x); }catch(err){ console.error(err); } } toast(tasks.length+' éléments importés'); })();
      break; }
  }
});

route();
init();
</script>
</body>
</html>
